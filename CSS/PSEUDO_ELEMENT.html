    <!-- pseudo element
     >01.first-letter
     >02.first-line
     >03.befor
     >04.after
     >05.selection
     >06.placeholder
     >07.marker
     syntax:
      >selector::pseudo-element{
       //css prop
       } -->
    <style>
        h1{
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        h1::first-letter {

            color: gold;
            font-size: 3.5rem;

        }

        /* p::first-line {
            color: aquamarine;

        }
        
         */
         h2{
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size:2.5em; ;
         }
        h2::before{
            content: "I ❤️";
        }
        h2::after{
            content: " BTM";
        }
        p{
            text-align: center;
            font-size: 10rem;
            font-weight: 900;
            /* display: inline-block; */
        }
        p::after{
            content: "";
            height: 5px;
            background-color: burlywood;
            display: block;
            transform: scalex(0);
            
        }
        p:hover:after{
            transform:scale(1) ;
            transition: all 1s ease-in-out ;
        }
    </style>
