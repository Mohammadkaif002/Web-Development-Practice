<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <tr height="60px">
        <td>
            <input type="radio" name="gender" id="male"/>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female"/>
            <label for="female">Female</label>
            <input type="radio" name="gender" id="Others"/>
            <label for="others">Others</label>
        </td>
        <td>
            <input type="checkbox" name="class" id="blore" checked>
            <label for="blore">Banglore</label>
            <input type="checkbox" name="class" id="coc" disabled>
            <label for="coc">Cochin</label>
            <input type="checkbox" name="class" id="Bihar" unchecked>
            <label for="Bihar">Bihar</label>
        </td>
        <tr>
            <th>Buttons</th>
            <td>
                <input type="button" value="Click Me" >
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>    
        </tr>
    </tr
</body>
</html>
